<!DOCTYPE html>
<html>
<head>
    <title>3D Virtual Campus Tour</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            line-height: 50px;
            font-size: 22px;
            z-index: 3;
        }

        /* Left Menu */
        .menu {
            position: absolute;
            top: 50px;
            left: 0;
            width: 230px;
            height: calc(100vh - 50px);
            background: #1c1c1c;
            padding: 15px;
            z-index: 2;
        }

        .menu button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            background: #3498db;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .menu button:hover {
            background: #1f78c1;
        }

        /* A-Frame Scene */
        a-scene {
            margin-left: 230px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">3D Virtual Campus Tour</div>

<!-- MENU -->
<div class="menu">
    <button onclick="changeScene('https://tse4.mm.bing.net/th/id/OIP.nfz9eGA9I39t7WzJT9rgVwHaE8?pid=Api&P=0&h=180')">Entrance</button>
    <button onclick="changeScene('https://mrcet.com/images/about-video-bg.jpg')">Campus View</button>
    <button onclick="changeScene('https://tothotornot.com/wp-content/uploads/2024/02/narrm-ngarrgu-Queen-Victoria-Market-Library-Photos-Joyce-Watts-1000px-2.jpg')">Library</button>
    <button onclick="changeScene('https://www.campusoption.com/images/colleges/gallery/07_02_17_062953_lab.gif')">Laboratory</button>
    <button onclick="changeScene('https://tse2.mm.bing.net/th/id/OIP.WO_U9XxMgL1fg97B9dwIvwHaE8?pid=Api&P=0&h=180')">Auditorium</button>
</div>

<!-- 360° SCENE -->
<a-scene>
    <a-sky id="sky" src="entrance.jpg" rotation="0 -120 0"></a-sky>
    <a-entity camera look-controls position="0 1.6 0"></a-entity>
</a-scene>

<!-- JAVASCRIPT -->
<script>
    function changeScene(image) {
        document.getElementById("sky").setAttribute("src", image);
    }
</script>

</body>
</html>
